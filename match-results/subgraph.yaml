specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Game
    network: matic
    source:
      address: "0xbD4680D8A39CB68A11794e235212AD7664504d84"
      abi: Game
      startBlock: 85397813
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MatchPlayed
        - PlayedMatch
        - NewMatch
        - PlayerScored
      abis:
        - name: Game
          file: ./abis/Game.json
      eventHandlers:
        - event: MatchSnapshot(uint256,address,address,(uint256[3],uint256[3],uint256[3]),(uint256[3],uint256[3],uint256[3]))
          handler: handleMatchSnapshot
        - event: MatchPlayed(uint256,uint8,uint8)
          handler: handleMatchPlayed
        - event: NewMatch(uint256)
          handler: handleNewMatch
        - event: PlayerScored(uint256,uint256)
          handler: handlePlayerScored
      file: ./src/game.ts
