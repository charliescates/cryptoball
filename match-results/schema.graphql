type MatchPlayed @entity(immutable: true) {
  id: Bytes!
  matchId: BigInt! # uint256
  homeScore: Int! # uint8
  awayScore: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type ExtraTimePlayed @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  homeScore: Int! # uint8
  awayScore: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type GoldenGoalPlayed @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  homeScore: Int! # uint8
  awayScore: Int! # uint8
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type PlayedMatch @entity(immutable: false) {
  id: String!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  homeScore: Int! # uint8
  awayScore: Int! # uint8
  homeAddress: Bytes!
  awayAddress: Bytes!
  homeAttackingPlayers: [BigInt!]!
  homeMidfieldPlayers: [BigInt!]!
  homeDefensivePlayers: [BigInt!]!
  awayAttackingPlayers: [BigInt!]!
  awayMidfieldPlayers: [BigInt!]!
  awayDefensivePlayers: [BigInt!]!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  extraTimePlayeds: [ExtraTimePlayed!]! @derivedFrom(field: "playedMatch")
  goldenGoalPlayeds: [GoldenGoalPlayed!]! @derivedFrom(field: "playedMatch")
  playerMatchInfos: [PlayerMatchInfo!]! @derivedFrom(field: "playedMatch")
  playerScoreds: [PlayerScored!]! @derivedFrom(field: "playedMatch")
  teamStatsCalculateds: [TeamStatsCalculated!]! @derivedFrom(field: "playedMatch")
  winningsDistributeds: [WinningsDistributed!]! @derivedFrom(field: "playedMatch")
}

type NewMatch @entity(immutable: true) {
  id: Bytes!
  matchId: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type PlayerScored @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  playerId: BigInt! # uint256
  goalOrder: Int!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type PlayerMatchInfo @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  playerId: BigInt! # uint256
  owner: Bytes! # address
  attack: BigInt! # uint256
  defense: BigInt! # uint256
  potential: BigInt! # uint256
  gamesLeft: BigInt! # uint256
  goals: BigInt! # uint256
  playerType: Int! # uint8
  position: String!
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type TeamStatsCalculated @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  tournamentId: BigInt! # uint256
  team: Bytes! # address
  totalAttack: BigInt! # uint256
  totalDefense: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type WinningsDistributed @entity(immutable: true) {
  id: Bytes!
  playedMatch: PlayedMatch!
  matchId: BigInt! # uint256
  winner: Bytes! # address
  winnings: BigInt! # uint256
  academy: Bytes! # address
  academyShare: BigInt! # uint256
  executor: Bytes! # address
  executorFee: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

  type TournamentMatchPlayed @entity(immutable: true) {
    id: Bytes!
    tournamentId: BigInt! # uint256
    tournamentMatchId: BigInt! # uint256
    round: Int! # uint8
    homeAddress: Bytes! # address
    awayAddress: Bytes! # address
    winner: Bytes! # address
    homeScore: Int! # uint8
    awayScore: Int! # uint8
    blockNumber: BigInt!
    blockTimestamp: BigInt!
    transactionHash: Bytes!
  }
