specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Game
    network: mainnet
    source:
      # Default Hardhat localhost address from deterministic deployment order.
      # Update if your local deployment outputs a different address.
      address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      abi: Game
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - MatchPlayed
        - ExtraTimePlayed
        - GoldenGoalPlayed
        - PlayedMatch
        - NewMatch
        - PlayerScored
        - PlayerMatchInfo
        - TeamStatsCalculated
        - WinningsDistributed
        - TournamentMatchPlayed
      abis:
        - name: Game
          file: ./abis/Game.json
      eventHandlers:
        - event: MatchSnapshot(uint256,uint256,address,address,(uint256[3],uint256[3],uint256[3]),(uint256[3],uint256[3],uint256[3]))
          handler: handleMatchSnapshot
        - event: MatchPlayed(uint256,uint8,uint8)
          handler: handleMatchPlayed
        - event: ExtraTimePlayed(uint256,uint256,uint8,uint8)
          handler: handleExtraTimePlayed
        - event: GoldenGoalPlayed(uint256,uint256,uint8,uint8)
          handler: handleGoldenGoalPlayed
        - event: NewMatch(uint256)
          handler: handleNewMatch
        - event: PlayerMatchInfo(uint256,uint256,uint256,address,uint256,uint256,uint256,uint256,uint256,uint8,uint8)
          handler: handlePlayerMatchInfo
        - event: PlayerScored(uint256,uint256,uint256)
          handler: handlePlayerScored
        - event: TeamStatsCalculated(uint256,uint256,address,uint256,uint256)
          handler: handleTeamStatsCalculated
        - event: WinningsDistributed(uint256,address,uint256,address,uint256,address,uint256)
          handler: handleWinningsDistributed
        - event: TournamentMatchPlayed(indexed uint256,uint256,indexed uint8,address,address,address,uint8,uint8)
          handler: handleTournamentMatchPlayed
      file: ./src/game.ts