specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Market
    network: mainnet
    source:
      # Default Hardhat localhost address from deterministic deployment order.
      # Update if your local deployment outputs a different address.
      address: "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      abi: Market
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BidPlaced
        - BoughtNow
        - Finalized
        - Listed
      abis:
        - name: Market
          file: ./abis/Market.json
      eventHandlers:
        - event: BidPlaced(uint256,address,uint256)
          handler: handleBidPlaced
        - event: BoughtNow(uint256,address,uint256)
          handler: handleBoughtNow
        - event: Finalized(uint256,address,uint256)
          handler: handleFinalized
        - event: Listed(uint256,address,uint256,uint256,uint256)
          handler: handleListed
      file: ./src/market.ts