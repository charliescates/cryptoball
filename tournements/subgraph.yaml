specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: tournement
    network: matic
    source:
      address: "0x3EE3D991B977f8Ee569e345D9ef615b762973901"
      abi: tournement
      startBlock: 86994583
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TournementCompleted
        - TournementCreated
        - TeamEntered
        - TournementMatchStarted
        - TournementRoundAdvanced
        - TournementReady
        - TournementCancelled
        - TournementEntryRefunded
        - TournementExecutorCompensated
        - TournementRewardClaimed
      abis:
        - name: tournement
          file: ./abis/tournement.json
      eventHandlers:
        - event: TournementCompletedSummary(indexed uint256,indexed address,uint256,uint256)
          handler: handleTournementCompleted
        - event: TournementCreated(indexed uint256,indexed address,string,uint8,uint256,uint8,uint8,uint8,uint8,uint8[],uint8[])
          handler: handleTournementCreated
        - event: TeamEntered(indexed uint256,indexed address,uint8)
          handler: handleTeamEntered
        - event: TournementMatchStarted(indexed uint256,uint256,indexed uint8,address,address)
          handler: handleTournementMatchStarted
        - event: TournementRoundAdvanced(indexed uint256,uint8,uint8,uint8)
          handler: handleTournementRoundAdvanced
        - event: TournementReady(indexed uint256,uint8)
          handler: handleTournementReady
        - event: TournementCancelled(indexed uint256,indexed address)
          handler: handleTournementCancelled
        - event: TournementEntryRefunded(indexed uint256,indexed address,uint256)
          handler: handleTournementEntryRefunded
        - event: TournementExecutorCompensated(indexed uint256,indexed address,uint256)
          handler: handleTournementExecutorCompensated
        - event: TournementRewardClaimed(indexed uint256,indexed address,uint256)
          handler: handleTournementRewardClaimed
      file: ./src/tournement.ts
